name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Secret scan ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so Gitleaks can diff commits

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Backend tests ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          # Install everything from requirements.txt except torch (too large for CI)
          grep -v '^torch' requirements.txt > /tmp/ci-requirements.txt
          pip install --quiet -r /tmp/ci-requirements.txt
          pip install --quiet google-genai

      - name: Run test suite
        working-directory: backend
        run: timeout 600 python run_tests.py -v

  # ── 3. Bandit SAST ──────────────────────────────────────────────────────────
  sast:
    name: Bandit SAST
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: pip install --quiet bandit

      - name: Run Bandit
        working-directory: backend
        run: |
          bandit -r . \
            -x ./tests/ \
            --severity-level medium \
            --confidence-level medium \
            --exit-zero \
            -f json -o bandit-report.json
          # Fail if any medium+/medium+ findings exist
          python -c "
          import json, sys
          r = json.load(open('bandit-report.json'))
          issues = r.get('results', [])
          if issues:
              for i in issues:
                  print(f\"[{i['issue_severity']}/{i['issue_confidence']}] {i['filename']}:{i['line_number']} — {i['issue_text']}\")
              sys.exit(1)
          print('Bandit: no findings')
          "

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ── 3b. Dependency audit (SCA) ──────────────────────────────────────────────
  # Complements Bandit (SAST) with dependency-CVE scanning — the gap that let the
  # requirements.txt / wheel-cache / site-packages version drift go unnoticed.
  # Informational (continue-on-error) for now: it still surfaces the deferred
  # starlette CVEs (need a FastAPI bump off 0.115) and the frontend vite/esbuild
  # chain (needs vite@8). Flip continue-on-error to false once those land so it
  # blocks NEW vulnerable deps. Torch is excluded (too large for CI), mirroring
  # the backend-tests job.
  sca:
    name: Dependency audit (SCA)
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps (minus torch) + pip-audit
        working-directory: backend
        run: |
          grep -v '^torch' requirements.txt > /tmp/ci-requirements.txt
          pip install --quiet -r /tmp/ci-requirements.txt
          pip install --quiet pip-audit

      - name: pip-audit (installed environment)
        run: pip-audit --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  # ── 4. Frontend type-check ──────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── 5. Frontend build ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build
        working-directory: frontend
        run: npm run build
        env:
          # Suppress self-signed cert warnings in CI (no certs/ dir present)
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 6. Release tag (main branch only) ──────────────────────────────────────
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-tests, sast, frontend-build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # Date-based version: YYYY.MM.DD.HHMM
          echo "tag=$(date -u +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${{ steps.version.outputs.tag }}`,
              sha:   context.sha,
            });
            core.info(`Tagged ${{ steps.version.outputs.tag }}`);
